<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E4E4E4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>IKAI — We turn ideas into products</title>
    <meta name="description" content="IKAI turns ideas into products: research, brand strategy, UI/UX design, interactive prototypes, design systems and go-to-market plans that get founders funded." />
    <script>
      // theme before first paint: saved choice, else the OS preference
      (function () {
        var t = 'light'
        try { t = localStorage.getItem('ikai-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') } catch (e) {}
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0D0E10')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
